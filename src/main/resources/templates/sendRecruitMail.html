<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns="http://www.w3.org/1999/xhtml"
>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>CEOS Recruitment</title>
    <style>
        html,
        body {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body,
        table,
        td,
        a,
        span {
            font-family: Pretendard ,AppleSDGothic, apple sd gothic neo, noto sans korean,
            noto sans korean regular, noto sans cjk kr, noto sans cjk,
            nanum gothic, malgun gothic, dotum, arial, helvetica, MS Gothic,
            sans-serif !important;
            mso-line-height-rule: exactly;
            -ms-text-size-adjust: 100% !important;
            -webkit-text-size-adjust: 100% !important;
        }

        table,
        td {
            border-collapse: collapse !important;
            border-spacing: 0 !important;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            border: 0;
        }

        .email-container {
            width: 100% !important;
            max-width: 720px !important;
        }

        .mail-fluid {
            width: 100% !important;
            max-width: 680px !important;
        }

        .recruit-copy,
        .recruit-body {
            overflow-wrap: anywhere;
            word-break: keep-all;
        }

        @media only screen and (max-width: 720px) {
            .email-content {
                padding-right: 20px !important;
                padding-left: 20px !important;
            }

            .recruit-heading {
                font-size: 22px !important;
                line-height: 140% !important;
            }

            .recruit-copy,
            .recruit-body {
                font-size: 16px !important;
                line-height: 170% !important;
            }

            .recruit-button {
                padding: 14px 48px !important;
                font-size: 18px !important;
            }

            .copyright-text {
                font-size: 14px !important;
            }
        }
    </style>
</head>
<body style="width: 100%; margin: 0; padding: 0; background-color: #FFFFFF;" bgcolor="#FFFFFF">
<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
       style="width: 100%; margin: 0; padding: 0; background-color: #FFFFFF;" bgcolor="#FFFFFF">
    <tr>
        <td align="center" style="padding: 0;">
            <table class="email-container" role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                   style="width: 100%; max-width: 720px; margin: 0 auto;">
                <tr>
                    <td class="email-content" style="padding: 0 20px;">
                        <div th:replace="~{component/title :: title}">title</div>
                        <div th:replace="~{component/divider :: divider}">divider</div>
                        <div th:replace="~{component/recruitGreeting :: greetInfo(greetInfo=${greetInfo})}">greeting</div>
                        <div style="height: 30px; line-height: 30px; font-size: 0;">&nbsp;</div>
                        <div th:replace="~{component/recruit :: recruit}">recruit</div>
                        <div th:replace="~{component/divider :: divider}">divider</div>
                        <div style="height: 60px; line-height: 60px; font-size: 0;">&nbsp;</div>
                        <div th:replace="~{component/recruitButton :: button}">button</div>
                        <div style="height: 40px; line-height: 40px; font-size: 0;">&nbsp;</div>
                        <div th:replace="~{component/copyright :: copyright}">copyright</div>
                        <div style="height: 24px; line-height: 24px; font-size: 0;">&nbsp;</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
